<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말 읽어주기</title>
<style>
:root{--bg:#fffdf7;--fg:#111;--muted:#8a8578;--line:#e5e1d8;--card:#fff;--accent:#1f6feb;--rec:#d1242f;--warn:#b35900}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f5f5f5;--muted:#9a9a9a;--line:#333;--card:#1d1d1d;--warn:#ffab5c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{display:flex;flex-direction:column;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.top select{flex:1;min-width:0;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.top button{font-size:16px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);white-space:nowrap}
#status{font-size:18px;color:var(--muted);min-height:26px;margin-bottom:8px;white-space:pre-line}
#status.warn{color:var(--warn);font-weight:600}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item .txt{flex:1;padding:16px 18px;font-size:34px;font-weight:600;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;cursor:pointer}
.item .txt::before{content:"🔊 ";font-size:.7em}
.item .txt:active{background:var(--line)}
.item .del{border:none;border-left:1px solid var(--line);background:transparent;color:var(--muted);font-size:24px;width:56px;cursor:pointer}
#interim{font-size:28px;color:var(--muted);padding:4px 6px}
.empty{color:var(--muted);font-size:22px;line-height:1.5}
#mic{margin-top:12px;width:100%;padding:24px;font-size:28px;font-weight:700;border:none;border-radius:20px;
  background:var(--accent);color:#fff;cursor:pointer}
#mic.on{background:var(--rec)}
</style>
</head>
<body>

<div class="top">
  <select id="voice" aria-label="목소리"></select>
  <button id="clearAll">전체 삭제</button>
</div>
<div id="status"></div>
<div id="list"></div>
<div id="interim"></div>
<button id="mic">🎤 듣기 시작</button>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const list=$('list'), mic=$('mic'), st=$('status'), interimEl=$('interim'), voiceSel=$('voice');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const say=(t,warn)=>{ st.textContent=t||''; st.classList.toggle('warn',!!warn); };

  // ── 저장 (이 브라우저 안에 계속 남음) ──
  const KEY='voiceReader.items';
  const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } };
  const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} };
  let items=load();

  function render(){
    list.innerHTML='';
    if(!items.length){
      list.innerHTML='<div class="empty">① 아래 <b>듣기 시작</b>을 누르고 말하세요 → 글로 바뀝니다.<br>② <b>듣기 정지</b>를 누를 때까지 계속 듣습니다.<br>③ 글을 누르면 소리로 읽어줍니다. ✕로 지웁니다.</div>';
      return;
    }
    items.forEach((it,i)=>{
      const row=document.createElement('div'); row.className='item';
      const t=document.createElement('div'); t.className='txt'; t.textContent=it.text;
      t.onclick=()=>speak(it.text);
      const d=document.createElement('button'); d.className='del'; d.textContent='✕'; d.setAttribute('aria-label','삭제');
      d.onclick=()=>{ items.splice(i,1); save(); render(); };
      row.append(t,d); list.appendChild(row);
    });
    list.scrollTop=list.scrollHeight;
  }
  function add(text){
    text=(text||'').trim(); if(!text) return;
    items.push({text, at:Date.now()}); save(); render();
  }
  $('clearAll').onclick=()=>{
    if(!items.length) return;
    if(confirm('저장된 글을 모두 지울까요?')){ items=[]; save(); render(); }
  };
  render();

  // ── 열린 환경 점검 ──
  const ua=navigator.userAgent;
  if(/KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua)){
    say('카카오톡·네이버 등 앱 안에서 열려 있어 마이크가 안 됩니다.\n오른쪽 위 메뉴 → "다른 브라우저로 열기"로 Chrome(아이폰은 Safari)에서 여세요.',true);
  } else if(/SamsungBrowser/i.test(ua)){
    say('삼성 인터넷은 음성 인식이 잘 안 됩니다. Chrome으로 열어 주세요.',true);
  } else if(location.protocol!=='https:' && location.hostname!=='localhost'){
    say('파일을 직접 열면 마이크가 막힙니다. https 주소로 열어 주세요.',true);
  } else if(!SR){
    say('이 브라우저는 음성 인식을 지원하지 않아요. Chrome(아이폰은 Safari)으로 열어 주세요.',true);
  }

  // ── 목소리: 휴대폰에 설치된 한국어 목소리 목록 ──
  const VKEY='voiceReader.voice';
  let voices=[];
  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    const all=speechSynthesis.getVoices();
    const ko=all.filter(v=>/^ko/i.test(v.lang));
    voices=ko.length?ko:all;
    const saved=(()=>{ try{return localStorage.getItem(VKEY);}catch(e){return null;} })();
    voiceSel.innerHTML='<option value="">기본 목소리 (휴대폰 설정)</option>'+
      voices.map((v,i)=>`<option value="${i}">${v.name}${v.localService?'':' (온라인)'}</option>`).join('');
    const idx=voices.findIndex(v=>v.name===saved);
    voiceSel.value= idx>=0? String(idx) : '';
  }
  if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
  voiceSel.onchange=()=>{
    const v=voices[+voiceSel.value];
    try{ localStorage.setItem(VKEY, voiceSel.value===''?'':v.name); }catch(e){}
    speak('안녕하세요. 이 목소리로 읽어드릴게요.');
  };

  // ── 듣기: 정지 누를 때까지 계속 ──
  let rec=null, want=false, running=false, speaking=false, wakeLock=null;

  function makeRec(){
    const r=new SR();
    r.lang='ko-KR'; r.continuous=false; r.interimResults=true; r.maxAlternatives=1;
    r.onstart=()=>{ running=true; if(want && !speaking) say('● 듣고 있어요. 말씀하세요.'); };
    r.onresult=e=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal) add(res[0].transcript);
        else interim+=res[0].transcript;
      }
      interimEl.textContent=interim;
    };
    r.onerror=e=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){
        stop(); say('마이크 권한이 막혀 있어요. 주소창 왼쪽 자물쇠(설정) → 마이크 → 허용으로 바꿔 주세요.',true);
      } else if(e.error==='audio-capture'){
        stop(); say('마이크를 찾을 수 없어요. 다른 앱이 마이크를 쓰고 있는지 확인해 주세요.',true);
      } else if(e.error==='network'){
        say('인터넷 연결이 불안정해요. 다시 시도 중…',true);
      }
      // no-speech, aborted 는 조용히 넘어가고 아래 onend 에서 다시 시작
    };
    r.onend=()=>{
      running=false; interimEl.textContent='';
      if(want && !speaking) setTimeout(begin, 200);  // 정지 누르기 전까지 계속 다시 듣기
    };
    return r;
  }
  function begin(){
    if(!want || running || speaking) return;
    if(!rec) rec=makeRec();
    try{ rec.start(); }catch(e){}
  }
  function start(){
    if(!SR) return;
    want=true; updateBtn(); begin(); keepAwake(true);
  }
  function stop(){
    want=false; updateBtn(); interimEl.textContent='';
    try{ rec && rec.stop(); }catch(e){}
    keepAwake(false); say('');
  }
  function updateBtn(){
    mic.classList.toggle('on',want);
    mic.textContent= want ? '⏹ 듣기 정지' : '🎤 듣기 시작';
  }
  mic.onclick=()=>{ unlockSpeech(); want?stop():start(); };

  async function keepAwake(on){
    try{
      if(on && 'wakeLock' in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>wakeLock=null); }
      if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
    }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && want){ keepAwake(true); begin(); } });

  // ── 소리로 읽기 ──
  function speak(t){
    if(!('speechSynthesis' in window)){ say('이 브라우저는 소리 읽기를 지원하지 않아요.',true); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='ko-KR';
    const v=voices[+voiceSel.value]; if(voiceSel.value!=='' && v) u.voice=v;
    u.rate=0.9; u.volume=1;
    // 읽는 동안 듣기를 잠깐 멈춰서 읽는 소리를 다시 받아적지 않게 함
    u.onstart=()=>{ speaking=true; if(want){ say('🔊 읽는 중… (끝나면 다시 듣습니다)'); try{rec&&rec.abort();}catch(e){} } };
    const done=()=>{ speaking=false; if(want) begin(); };
    u.onend=done; u.onerror=done;
    speechSynthesis.speak(u);
  }
  let unlocked=false;
  function unlockSpeech(){
    if(unlocked||!('speechSynthesis' in window)) return;
    const p=new SpeechSynthesisUtterance(' '); p.volume=0; speechSynthesis.speak(p); unlocked=true;
  }
})();
</script>
</body>
</html>
